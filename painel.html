<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel do funil | Central de Voos</title>
<link rel="icon" href="midia/logo-avatar.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Painel interno do funil interativo: quantas pessoas chegam em cada etapa, por versão do teste A/B. */
  :root {
    --fundo: #f6f7f9; --superficie: #fff; --linha: #e6e8ec; --tinta: #15171a; --tinta-2: #3d424a; --suave: #646a73;
    --azul: #2457d6; --azul-fundo: #edf2fd; --verde: #138a57; --verde-fundo: #e9f6ef; --vermelho: #b4233c; --vermelho-fundo: #fbecef;
    --a: #2457d6; --b: #d97706; --c: #7c3aed; --d: #0f766e;
    --r: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--fundo); color: var(--tinta); font: 15px/1.5 "Geist", -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .topo { position: sticky; top: 0; z-index: 5; background: var(--superficie); border-bottom: 1px solid var(--linha); }
  .topo-in { max-width: 1080px; margin: 0 auto; padding: 12px max(16px, env(safe-area-inset-left)); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .marca { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .marca img { width: 36px; height: 36px; border-radius: 10px; background: #1b1b1b; }
  .marca strong { display: block; font-size: 16px; letter-spacing: -.01em; }
  .marca span { font-size: 12.5px; color: var(--suave); }
  .filtros { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  select, .chave { font: inherit; font-size: 14px; color: var(--tinta); background: var(--superficie); border: 1px solid var(--linha); border-radius: 10px; padding: 8px 10px; min-height: 40px; }
  .chave { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  main { max-width: 1080px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-left)) 48px; display: grid; gap: 16px; }
  .cartao { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--r); padding: 18px; }
  .cartao h2 { margin: 0 0 4px; font-size: 16px; letter-spacing: -.01em; }
  .cartao .sub { margin: 0 0 14px; color: var(--suave); font-size: 13.5px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .kpi { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--r); padding: 14px 16px; }
  .kpi span { display: block; font-size: 13px; color: var(--suave); }
  .kpi b { display: block; font-size: clamp(26px, 6vw, 32px); font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.15; margin-top: 4px; }
  .kpi small { font-size: 12.5px; color: var(--suave); }
  .veredito { display: flex; gap: 12px; align-items: flex-start; }
  .veredito .ic { flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; background: var(--azul-fundo); }
  .veredito.ganhou .ic { background: var(--verde-fundo); }
  .veredito p { margin: 0; }
  .veredito .t { font-weight: 650; }
  .veredito .s { color: var(--suave); font-size: 13.5px; margin-top: 2px; }
  .legenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--tinta-2); margin-bottom: 10px; }
  .legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .tabela { width: 100%; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--linha); vertical-align: middle; }
  th { font-size: 12px; font-weight: 600; color: var(--suave); text-transform: uppercase; letter-spacing: .04em; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.opcional td:first-child { color: var(--suave); }
  .etapa-nome { display: flex; flex-direction: column; }
  .etapa-nome small { color: var(--suave); font-size: 12px; }
  .barra { height: 8px; background: #eef0f3; border-radius: 99px; overflow: hidden; min-width: 80px; }
  .barra i { display: block; height: 100%; border-radius: 99px; }
  .queda { font-size: 12px; color: var(--vermelho); }
  .queda.maior { background: var(--vermelho-fundo); padding: 1px 6px; border-radius: 6px; font-weight: 600; }
  .vazio { text-align: center; color: var(--suave); padding: 36px 12px; }
  .rodape { color: var(--suave); font-size: 12.5px; text-align: center; }
  .erro { color: var(--vermelho); }
  @media (max-width: 640px) { .marca { width: 100%; } .filtros { width: 100%; } .filtros select { flex: 1; min-width: 0; } }
</style>
</head>
<body>
  <header class="topo"><div class="topo-in">
    <div class="marca"><img src="midia/logo-avatar.png" alt=""><div><strong>Painel do funil</strong><span>Diagnóstico de economia · métricas por etapa e teste A/B</span></div></div>
    <div class="filtros">
      <select id="dias" aria-label="Período"><option value="1">Últimas 24 h</option><option value="7" selected>Últimos 7 dias</option><option value="30">Últimos 30 dias</option><option value="90">Últimos 90 dias</option></select>
      <select id="experimento" aria-label="Teste A/B"></select>
      <select id="fonte" aria-label="Origem do tráfego"></select>
      <label class="chave"><input type="checkbox" id="teste"> Dados de teste</label>
    </div>
  </div></header>
  <main>
    <section class="kpis" id="kpis"></section>
    <section class="cartao" id="ab"></section>
    <section class="cartao">
      <h2>Funil por etapa</h2>
      <p class="sub">Pessoas (sessões) que chegaram em cada etapa. A porcentagem é sobre quem abriu o site; em vermelho, quantos pararam ali.</p>
      <div class="legenda" id="legenda"></div>
      <div class="tabela" id="funil"></div>
    </section>
    <p class="rodape" id="rodape">Carregando…</p>
  </main>
<script>
  // Endereço da função que devolve as métricas (Supabase, projeto CDV Financeiro).
  const API = "https://qjyswtxspktkqoyqjjwp.supabase.co/functions/v1/funil-metricas";
  // As etapas do funil, na ordem. "opcional" = nem todo mundo passa (quem chega com telefone no link pula a cidade).
  const ETAPAS = [
    { ev: "inicio", nome: "Abriu o site" },
    { ev: "aceitou", nome: "Tocou em \"SIM, Claro!\"" },
    { ev: "etapa", n: 1, nome: "Disse o nome" },
    { ev: "etapa", n: 2, nome: "Disse onde compra passagens" },
    { ev: "etapa", n: 3, nome: "Respondeu sobre milhas", det: "e viu a história de Paris" },
    { ev: "etapa", n: 4, nome: "Tocou em \"Quero ser VIP\"", det: "depois das vantagens e bônus" },
    { ev: "etapa", n: 5, nome: "Escolheu o destino" },
    { ev: "etapa", n: 6, nome: "Disse quando viaja" },
    { ev: "etapa", n: 7, nome: "Disse quantas pessoas" },
    { ev: "etapa", n: 8, nome: "Disse a cidade de saída", det: "só quem chega sem telefone no link", opcional: true },
    { ev: "promo_exemplo", nome: "Viu a promoção" },
    { ev: "resultado", nome: "Viu a economia" },
    { ev: "abriu_presente", nome: "Abriu o presente" },
    { ev: "oferta", nome: "Viu a oferta" },
    { ev: "checkout", nome: "Clicou em \"Entrar para o VIP\"", det: "foi pro checkout" },
    { ev: "copiou_cupom", nome: "Copiou o cupom", opcional: true },
  ];
  const CORES = ["var(--a)", "var(--b)", "var(--c)", "var(--d)"];
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => Number(n || 0).toLocaleString("pt-BR");
  const pct = (a, b) => (b ? (a / b) * 100 : 0);
  const pctTxt = (v) => v.toLocaleString("pt-BR", { maximumFractionDigits: v < 10 ? 1 : 0 }) + "%";
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // Probabilidade normal acumulada (pra confiança do teste A/B entre duas taxas).
  function phi(z) { const t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989423 * Math.exp(-z * z / 2), p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; }
  function comparar(c1, n1, c2, n2) {
    if (!n1 || !n2) return null;
    const p1 = c1 / n1, p2 = c2 / n2, p = (c1 + c2) / (n1 + n2), se = Math.sqrt(p * (1 - p) * (1 / n1 + 1 / n2));
    if (!se) return { p1, p2, conf: 0 };
    const z = (p2 - p1) / se;
    return { p1, p2, conf: 1 - 2 * (1 - phi(Math.abs(z))) };
  }

  let ultimo = null;
  function preencherFiltros(filtros) {
    const sel = (id, tipo, primeiro) => {
      const el = $(id), atual = el.value;
      const valores = filtros.filter((f) => f.tipo === tipo).sort((a, b) => b.sessoes - a.sessoes);
      el.innerHTML = '<option value="">' + primeiro + "</option>" + valores.map((f) => '<option value="' + esc(f.valor) + '">' + esc(f.valor) + " (" + fmt(f.sessoes) + ")</option>").join("");
      if ([...el.options].some((o) => o.value === atual)) el.value = atual;
    };
    sel("experimento", "experimento", "Todos os testes");
    sel("fonte", "fonte", "Todas as origens");
  }

  function desenhar(dados) {
    // contagem[variante][chave da etapa] = sessões
    const contagem = {};
    for (const l of dados.linhas) {
      const v = l.variante || "A";
      contagem[v] = contagem[v] || {};
      const k = l.evento === "etapa" ? "etapa" + l.etapa : l.evento;
      contagem[v][k] = (contagem[v][k] || 0) + Number(l.sessoes); // soma os testes quando o filtro é "todos"
    }
    const variantes = Object.keys(contagem).sort();
    const chave = (e) => (e.ev === "etapa" ? "etapa" + e.n : e.ev);
    const total = (k) => variantes.reduce((t, v) => t + (contagem[v][k] || 0), 0);

    if (!variantes.length) {
      $("kpis").innerHTML = "";
      $("ab").innerHTML = '<div class="vazio">Ainda não há visitas nesse período' + ($("teste").checked ? " (dados de teste)" : "") + ".<br>Assim que o funil receber tráfego, os números aparecem aqui.</div>";
      $("funil").innerHTML = ""; $("legenda").innerHTML = "";
      return;
    }

    // Números grandes (somando as versões)
    const visitas = total("inicio"), ofertas = total("oferta"), checkouts = total("checkout");
    $("kpis").innerHTML = [
      ["Visitas", fmt(visitas), "abriram o site"],
      ["Viram a oferta", fmt(ofertas), pctTxt(pct(ofertas, visitas)) + " das visitas"],
      ["Foram pro checkout", fmt(checkouts), pctTxt(pct(checkouts, visitas)) + " das visitas"],
      ["Checkout / oferta", pctTxt(pct(checkouts, ofertas)), "de quem viu a oferta"],
    ].map(([t, n, s]) => '<div class="kpi"><span>' + t + "</span><b>" + n + "</b><small>" + s + "</small></div>").join("");

    // Teste A/B: compara a taxa de checkout (checkout ÷ visitas) entre as versões
    let ab = "";
    if (variantes.length < 2) {
      ab = '<div class="veredito"><div class="ic">🧪</div><div><p class="t">Só uma versão nesse filtro</p><p class="s">Escolha um teste com duas versões (A e B) pra comparar.</p></div></div>';
    } else {
      const taxas = variantes.map((v) => ({ v, n: contagem[v].inicio || 0, c: contagem[v].checkout || 0 }));
      taxas.sort((a, b) => pct(b.c, b.n) - pct(a.c, a.n));
      const [melhor, segundo] = taxas, r = comparar(segundo.c, segundo.n, melhor.c, melhor.n);
      const pouco = Math.min(melhor.n, segundo.n) < 100;
      const dif = r && r.p1 ? ((r.p2 - r.p1) / r.p1) * 100 : 0;
      const conf = r ? Math.round(r.conf * 100) : 0;
      const ganhou = !pouco && conf >= 95;
      const titulo = ganhou ? "Versão " + melhor.v + " está ganhando" : pouco ? "Ainda é cedo pra decidir" : "Empate técnico por enquanto";
      const sub = taxas.map((t) => "<b>" + t.v + "</b>: " + pctTxt(pct(t.c, t.n)) + " (" + fmt(t.c) + " de " + fmt(t.n) + ")").join(" · ") +
        (r && r.p1 ? " — " + melhor.v + " está " + Math.round(Math.abs(dif)) + "% " + (dif >= 0 ? "acima" : "abaixo") + ", com " + conf + "% de confiança." : ".") +
        (pouco ? " Espere pelo menos 100 visitas em cada versão." : ganhou ? " Já dá pra ficar com a versão " + melhor.v + "." : " Deixe rodar mais; o ideal é chegar a 95% de confiança.");
      ab = '<div class="veredito' + (ganhou ? " ganhou" : "") + '"><div class="ic">' + (ganhou ? "🏆" : "🧪") + '</div><div><p class="t">' + titulo + '</p><p class="s">Taxa de checkout (checkout ÷ visitas) — ' + sub + "</p></div></div>";
    }
    $("ab").innerHTML = "<h2>Teste A/B</h2>" + ab;

    // Funil: uma coluna por versão
    $("legenda").innerHTML = variantes.map((v, i) => '<span><i style="background:' + CORES[i % CORES.length] + '"></i>Versão ' + esc(v) + " · " + fmt(contagem[v].inicio || 0) + " visitas</span>").join("");
    // maior queda de cada versão (entre etapas obrigatórias)
    const maiorQueda = {};
    for (const v of variantes) {
      let ant = null, max = 0;
      for (const e of ETAPAS) { if (e.opcional) continue; const n = contagem[v][chave(e)] || 0; if (ant !== null && ant > 0) { const q = pct(ant - n, ant); if (q > max) { max = q; maiorQueda[v] = chave(e); } } ant = n; }
    }
    let html = "<table><thead><tr><th>Etapa</th>" + variantes.map((v) => '<th class="num">Versão ' + esc(v) + "</th><th></th>").join("") + "</tr></thead><tbody>";
    const anterior = {};
    for (const e of ETAPAS) {
      const k = chave(e);
      html += '<tr class="' + (e.opcional ? "opcional" : "") + '"><td><div class="etapa-nome">' + esc(e.nome) + (e.det ? "<small>" + esc(e.det) + "</small>" : "") + "</div></td>";
      variantes.forEach((v, i) => {
        const n = contagem[v][k] || 0, base = contagem[v].inicio || 0, p = pct(n, base);
        let queda = "";
        if (!e.opcional && anterior[v] != null && anterior[v] > 0 && n < anterior[v]) {
          queda = '<div class="queda' + (maiorQueda[v] === k ? " maior" : "") + '">−' + pctTxt(pct(anterior[v] - n, anterior[v])) + "</div>";
        }
        html += '<td class="num">' + fmt(n) + " <small>(" + pctTxt(p) + ")</small>" + queda + '</td><td><div class="barra"><i style="width:' + Math.min(p, 100).toFixed(1) + "%;background:" + CORES[i % CORES.length] + '"></i></div></td>';
        if (!e.opcional) anterior[v] = n;
      });
      html += "</tr>";
    }
    $("funil").innerHTML = html + "</tbody></table>";
  }

  async function carregar() {
    const q = new URLSearchParams({ dias: $("dias").value });
    if ($("experimento").value) q.set("experimento", $("experimento").value);
    if ($("fonte").value) q.set("fonte", $("fonte").value);
    if ($("teste").checked) q.set("teste", "1");
    try {
      const r = await fetch(API + "?" + q.toString(), { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      ultimo = await r.json();
      preencherFiltros(ultimo.filtros || []);
      desenhar(ultimo);
      $("rodape").textContent = "Atualizado às " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) + " · atualiza sozinho a cada minuto";
      $("rodape").classList.remove("erro");
    } catch (e) {
      $("rodape").textContent = "Não consegui carregar as métricas (" + e.message + "). Tento de novo em 1 minuto.";
      $("rodape").classList.add("erro");
    }
  }
  ["dias", "experimento", "fonte", "teste"].forEach((id) => $(id).addEventListener("change", carregar));
  carregar();
  setInterval(carregar, 60000);
</script>
</body>
</html>
