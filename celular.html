<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Funil no celular</title>
<style>
  /* Moldura de celular pra testar o funil no computador, no tamanho de um iPhone (390 × 844). */
  :root { --fundo: #0f1115; --texto: #e7e9ee; --suave: #9aa1ad; --borda: #2a2e36; --azul: #2457d6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fundo); color: var(--texto); font: 14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; min-height: 100dvh; }
  .barra { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .barra button { background: #1b1f27; color: var(--texto); border: 1px solid var(--borda); border-radius: 99px; padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  .barra button:hover { border-color: #3a404b; }
  .barra button.ativo { background: var(--azul); border-color: var(--azul); }
  .celular { --escala: 1; width: calc(414px * var(--escala)); height: calc(868px * var(--escala)); position: relative; flex: none; }
  .moldura { position: absolute; left: 0; top: 0; width: 414px; height: 868px; transform: scale(var(--escala)); transform-origin: 0 0;
    border-radius: 58px; background: #050506; padding: 12px; box-shadow: 0 0 0 2px #2b2f37, 0 30px 80px -20px rgba(0,0,0,.8), inset 0 0 0 2px #15171c; }
  .tela { width: 390px; height: 844px; border-radius: 46px; overflow: hidden; background: #fff; position: relative; }
  /* barra de status do iPhone (a ilha fica nela, como no aparelho de verdade) */
  .status { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 40px; background: #fff; color: #000; font-weight: 600; font-size: 16px; }
  .status .icones { display: flex; gap: 6px; align-items: center; }
  .tela iframe { width: 100%; height: calc(100% - 50px); border: 0; display: block; }
  .ilha { position: absolute; top: 22px; left: 50%; width: 120px; height: 34px; margin-left: -60px; background: #000; border-radius: 20px; z-index: 2; pointer-events: none; }
  .dica { color: var(--suave); font-size: 13px; text-align: center; max-width: 420px; }
</style>
</head>
<body>
  <div class="barra">
    <button type="button" id="recomecar">↺ Recomeçar</button>
    <button type="button" id="rapido">⚡ Modo rápido</button>
  </div>
  <div class="celular" id="celular">
    <div class="moldura">
      <div class="ilha"></div>
      <div class="tela"><div class="status"><span id="hora">9:41</span><span class="icones" aria-hidden="true"><svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.5a9.5 9.5 0 0 1 13 0M4 7.3a6 6 0 0 1 8 0M6.6 10a2.4 2.4 0 0 1 2.8 0"/></svg><svg width="26" height="12" viewBox="0 0 26 12"><rect x=".75" y=".75" width="22" height="10.5" rx="3" fill="none" stroke="#000" stroke-opacity=".4" stroke-width="1.5"/><rect x="2.5" y="2.5" width="16" height="7" rx="1.6"/><rect x="24" y="4" width="1.6" height="4" rx=".8" fill-opacity=".4"/></svg></span></div><iframe id="funil" title="Funil interativo" allow="autoplay; clipboard-write"></iframe></div>
    </div>
  </div>
  <p class="dica">Tela de um iPhone (390 × 844). O modo rápido deixa tudo 5x mais rápido, só pra pular etapas.</p>
<script>
  // Endereço do funil: ?src=... na própria página, ou a pasta site/ ao lado desta.
  const p = new URLSearchParams(location.search);
  const base = p.get("src") || "./";
  let rapido = p.get("rapido") === "1";
  const iframe = document.getElementById("funil"), botaoRapido = document.getElementById("rapido");
  function abrir() {
    const u = new URL(base, location.href);
    if (rapido) u.searchParams.set("teste", "1"); else u.searchParams.delete("teste");
    u.searchParams.set("_", Date.now()); // sempre uma conversa nova
    iframe.src = u.toString();
    botaoRapido.classList.toggle("ativo", rapido);
  }
  document.getElementById("recomecar").addEventListener("click", abrir);
  botaoRapido.addEventListener("click", () => { rapido = !rapido; abrir(); });
  // O celular encolhe pra caber na janela.
  function caber() {
    const disponivel = Math.min((innerHeight - 130) / 868, (innerWidth - 32) / 414, 1);
    document.getElementById("celular").style.setProperty("--escala", Math.max(.45, disponivel).toFixed(3));
  }
  const hora = () => { const d = new Date(); document.getElementById("hora").textContent = d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0"); };
  hora(); setInterval(hora, 15000);
  addEventListener("resize", caber); caber(); abrir();
</script>
</body>
</html>
