<style>
  /* Tema claro, sempre. Uma tinta (quase preto, como o logo), um destaque (azul) e o verde só pra dinheiro economizado. */
  :root {
    color-scheme: light;
    --fundo: #fafafa; --superficie: #ffffff; --bolha: #f0f1f3; --bolha-forte: #e7e9ec;

  .pular:focus { left: 8px; }

  /* ---------- topo ---------- */

  .opcoes.lista { flex-direction: column; align-items: stretch; }

  .opcoes.lista .opcao small { color: var(--suave); font-weight: 500; font-size: 13px; }
  .campo { display: flex; gap: 8px; align-items: center; background: var(--superficie); border: 1.5px solid var(--linha); border-radius: 99px; padding: 6px 6px 6px 18px; margin: 10px 0 2px 46px; transition: border-color .2s, box-shadow .2s; animation: entra .45s var(--mola) both; }
  .campo:focus-within { border-color: var(--destaque); box-shadow: 0 0 0 4px var(--destaque-fundo); }
  .campo input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; padding: 8px 0; }

  /* ---------- cartões ---------- */
  .cartao { flex: 1; min-width: 0; max-width: 520px; background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--r-cartao); border-bottom-left-radius: 6px; padding: 20px; color: var(--tinta-2); animation: cresce .6s var(--mola) both; }

  .passo.feito { color: var(--tinta-2); } .passo.feito .ic { background: var(--verde); border-color: var(--verde); animation: estoura .4s var(--mola); }

  .comparar { padding: 0; overflow: hidden; }
  .comparar .cols { display: grid; grid-template-columns: 1fr 1fr; }
  .comparar.um { max-width: 360px; } .comparar.um .cols { grid-template-columns: 1fr; }

  .comparar li.sim::before { content: "✓"; color: var(--verde); }
  .comparar .vip li.sim::before { color: #5fd39b; }

  .comparar li.nao::before { content: "✕"; color: #c9ccd2; }
  /* bônus: fundo transparente, contorno e destaques em roxo escuro, no mesmo tamanho dos cartões Grátis/VIP */
  .comparar.bonus { background: transparent; border: 1.5px solid #4c1d95; box-shadow: none; }

  .oferta { padding: 0; overflow: hidden; max-width: 520px; }

  /* ---------- print do WhatsApp (promoção de exemplo) ---------- */
